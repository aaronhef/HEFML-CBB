<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conference Tournament Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0c0f; --surface: #111318; --surface2: #181c24; --border: #252b36;
  --accent: #e8f430; --accent2: #ff4d6d; --accent3: #38bdf8;
  --text: #e8eaf0; --muted: #6b7585; --win: #22c55e;
  --font-display: 'Bebas Neue', sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;
  --font-body: 'IBM Plex Sans', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font-body); min-height: 100vh; overflow-x: hidden; }
body::before { content: ''; position: fixed; inset: 0; background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.025) 2px, rgba(0,0,0,0.025) 4px); pointer-events: none; z-index: 1000; }

header { padding: 16px 24px; border-bottom: 1px solid var(–border); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: var(–bg); z-index: 100; gap: 12px; flex-wrap: wrap; }
.header-left h1 { font-family: var(–font-display); font-size: 2rem; letter-spacing: 0.04em; color: var(–accent); line-height: 1; }
.header-left p { font-family: var(–font-mono); font-size: 0.6rem; color: var(–muted); letter-spacing: 0.12em; text-transform: uppercase; margin-top: 3px; }
.header-controls { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; }

.btn { border: none; padding: 8px 16px; font-family: var(–font-display); font-size: 1rem; letter-spacing: 0.06em; cursor: pointer; transition: opacity 0.15s, transform 0.1s; white-space: nowrap; }
.btn:hover { opacity: 0.85; transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn-sim { background: var(–accent2); color: white; }
.btn-draw { background: var(–accent3); color: #0a0c0f; }
.btn-outline { background: transparent; color: var(–muted); border: 1px solid var(–border); font-family: var(–font-mono); font-size: 0.7rem; letter-spacing: 0.06em; padding: 7px 13px; }
.btn-outline:hover { border-color: var(–accent); color: var(–accent); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

main { display: flex; height: calc(100vh - 69px); }

.sidebar { width: 250px; min-width: 250px; border-right: 1px solid var(–border); overflow-y: auto; background: var(–surface); }
.sidebar-label { font-family: var(–font-mono); font-size: 0.58rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(–muted); padding: 12px 12px 6px; }
.conf-item { padding: 7px 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; font-weight: 500; transition: background 0.1s; border-left: 2px solid transparent; }
.conf-item:hover { background: var(–surface2); }
.conf-item.active { background: var(–surface2); border-left-color: var(–accent); color: var(–accent); }
.conf-item .gc { font-family: var(–font-mono); font-size: 0.58rem; color: var(–muted); }

.bracket-area { flex: 1; overflow: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.bracket-header { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 10px; }
.bracket-title { font-family: var(–font-display); font-size: 2.2rem; letter-spacing: 0.04em; line-height: 1; }
.bracket-meta { font-family: var(–font-mono); font-size: 0.6rem; color: var(–muted); letter-spacing: 0.1em; margin-top: 4px; }
.mode-badge { display: inline-block; font-family: var(–font-mono); font-size: 0.58rem; letter-spacing: 0.1em; padding: 2px 7px; margin-top: 4px; }
.badge-projected { background: rgba(232,244,48,0.08); color: var(–accent); border: 1px solid rgba(232,244,48,0.25); }
.badge-random { background: rgba(56,189,248,0.08); color: var(–accent3); border: 1px solid rgba(56,189,248,0.25); }
.badge-manual { background: rgba(255,77,109,0.08); color: var(–accent2); border: 1px solid rgba(255,77,109,0.25); }

.header-btn-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

.rounds-container { display: flex; gap: 0; overflow-x: auto; flex: 1; min-height: 280px; padding-bottom: 6px; }
.round-col { display: flex; flex-direction: column; min-width: 205px; max-width: 230px; flex-shrink: 0; }
.round-header { font-family: var(–font-mono); font-size: 0.56rem; letter-spacing: 0.13em; text-transform: uppercase; color: var(–muted); padding: 5px 8px; border-bottom: 1px solid var(–border); margin-bottom: 7px; text-align: center; }
.round-games { display: flex; flex-direction: column; flex: 1; justify-content: space-around; }

.game-slot { margin: 4px 3px; }
.game-card { background: var(–surface); border: 1px solid var(–border); overflow: hidden; transition: border-color 0.1s; }
.game-card:hover { border-color: #353d4d; }

.team-row { display: flex; align-items: center; padding: 7px 9px; gap: 6px; cursor: pointer; transition: background 0.08s; }
.team-row:hover { background: var(–surface2); }
.team-row.winner { background: rgba(232,244,48,0.05); }
.team-row.loser { opacity: 0.32; }
.team-row:first-child { border-bottom: 1px solid var(–border); }
.win-dot { width: 5px; height: 5px; background: var(–accent); border-radius: 50%; flex-shrink: 0; }
.no-dot { width: 5px; height: 5px; flex-shrink: 0; }
.team-name { font-size: 0.75rem; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.team-power { font-family: var(–font-mono); font-size: 0.56rem; color: var(–muted); min-width: 30px; text-align: right; }
.team-prob { font-family: var(–font-mono); font-size: 0.66rem; color: var(–muted); min-width: 34px; text-align: right; }
.team-prob.fav { color: var(–win); }
.upset-tag { font-family: var(–font-mono); font-size: 0.46rem; background: var(–accent2); color: white; padding: 1px 3px; letter-spacing: 0.05em; flex-shrink: 0; }

.champion-col { min-width: 180px; max-width: 200px; }
.champion-card { margin: 4px 3px; background: linear-gradient(135deg, rgba(232,244,48,0.09), rgba(232,244,48,0.02)); border: 1px solid rgba(232,244,48,0.35); padding: 16px 12px; text-align: center; }
.champion-label { font-family: var(–font-mono); font-size: 0.54rem; letter-spacing: 0.18em; color: var(–accent); margin-bottom: 8px; }
.champion-name { font-family: var(–font-display); font-size: 1.4rem; color: var(–accent); letter-spacing: 0.04em; line-height: 1.1; }
.champion-sim-prob { font-family: var(–font-mono); font-size: 0.63rem; color: var(–muted); margin-top: 7px; }
.champion-ci { font-family: var(–font-mono); font-size: 0.56rem; color: rgba(107,117,133,0.65); margin-top: 2px; }

.stats-panel { width: 265px; min-width: 265px; border-left: 1px solid var(–border); overflow-y: auto; background: var(–surface); }
.stats-section { padding: 12px; border-bottom: 1px solid var(–border); }
.stats-section h3 { font-family: var(–font-mono); font-size: 0.56rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(–muted); margin-bottom: 9px; }

.sim-row { display: flex; align-items: center; padding: 3px 0; gap: 6px; border-bottom: 1px solid rgba(255,255,255,0.03); }
.sim-row:last-child { border-bottom: none; }
.sim-rank { font-family: var(–font-mono); font-size: 0.56rem; color: var(–muted); min-width: 14px; }
.sim-team { font-size: 0.72rem; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sim-pct { font-family: var(–font-mono); font-size: 0.68rem; color: var(–accent); min-width: 36px; text-align: right; }

.ci-bar { position: relative; height: 8px; min-width: 56px; }
.ci-bar-track { position: absolute; inset: 0; top: 3px; height: 2px; background: var(–border); }
.ci-bar-range { position: absolute; top: 3px; height: 2px; background: rgba(232,244,48,0.28); }
.ci-bar-point { position: absolute; top: 0; width: 6px; height: 6px; background: var(–accent); border-radius: 50%; transform: translateX(-50%); }

.stat-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.03); }
.stat-row:last-child { border-bottom: none; }
.stat-name { font-size: 0.73rem; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 5px; }
.stat-val { font-family: var(–font-mono); font-size: 0.68rem; color: var(–accent); min-width: 40px; text-align: right; }
.prob-bar { height: 2px; background: var(–border); overflow: hidden; }
.prob-fill { height: 100%; background: var(–accent); transition: width 0.3s; }

.sim-controls { padding: 12px; display: flex; flex-direction: column; gap: 7px; }
.running-ind { display: none; align-items: center; gap: 7px; font-family: var(–font-mono); font-size: 0.62rem; color: var(–accent); }
.spinner { width: 10px; height: 10px; border: 2px solid rgba(232,244,48,0.2); border-top-color: var(–accent); border-radius: 50%; animation: spin 0.6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.sim-note { font-family: var(–font-mono); font-size: 0.57rem; color: var(–muted); line-height: 1.65; }

.home-screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: 36px; }
.home-title { font-family: var(–font-display); font-size: 4.2rem; color: var(–accent); letter-spacing: 0.06em; text-align: center; line-height: 0.95; }
.home-sub { font-family: var(–font-mono); font-size: 0.7rem; color: var(–muted); letter-spacing: 0.09em; text-align: center; max-width: 480px; line-height: 1.85; }
.conf-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 5px; width: 100%; max-width: 800px; }
.conf-pill { background: var(–surface2); border: 1px solid var(–border); padding: 8px 11px; cursor: pointer; font-size: 0.78rem; font-weight: 600; transition: all 0.12s; display: flex; align-items: center; justify-content: space-between; gap: 5px; }
.conf-pill:hover { border-color: var(–accent); color: var(–accent); }
.conf-pill .gc { font-family: var(–font-mono); font-size: 0.58rem; color: var(–muted); }

.tooltip { position: fixed; background: var(–surface2); border: 1px solid var(–border); padding: 9px 11px; font-family: var(–font-mono); font-size: 0.66rem; pointer-events: none; z-index: 9999; max-width: 195px; display: none; line-height: 1.7; }

.live-dot { width: 6px; height: 6px; background: var(–accent2); border-radius: 50%; display: inline-block; animation: pulse 1.2s infinite; }
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.2; } }
.live-badge { font-family: var(–font-mono); font-size: 0.58rem; letter-spacing: 0.1em; color: var(–accent2); border: 1px solid rgba(255,77,109,0.35); padding: 3px 8px; display: flex; align-items: center; gap: 5px; }

::-webkit-scrollbar { width: 3px; height: 3px; }
::-webkit-scrollbar-thumb { background: var(–border); }
</style>

</head>

function wilsonCI(k,n,z=1.96){
  if(!n) return [0,0];
  const p=k/n, d=1+z*z/n;
  const c=(p+z*z/(2*n))/d;
  const mg=z*Math.sqrt(p*(1-p)/n+z*z/(4*n*n))/d;
  return [Math.max(0,c-mg),Math.min(1,c+mg)];
}

      const known=groups[rndNames[ri]];
      let hp,ap;
      if(known && known[Math.floor(i/2)]){
        const kg=known[Math.floor(i/2)];
        hp=kg.home_prob; ap=1-hp;
      } else {
        hp=ratedP(h.team,a.team); ap=1-hp;
      }
      nGames.push({home:h.team,away:a.team,home_prob:hp,away_prob:ap,home_power:h.power,away_power:a.power,isGen:!known});
    }
    const nm=rndNames[ri]||(nGames.length===1?'Championship':nGames.length<=2?'Semifinals':`Round ${ri+1}`);
    allRounds.push({name:nm, games:nGames, isGen:!rndNames[ri]});

    // Pick survivors
    surv=nGames.map((g,gi)=>{
      const k=`${curConf}_r${ri}_g${gi}`;
      let w=picks[k]||(probabilistic?(Math.random()<g.home_prob?g.home:g.away):(g.home_prob>=0.5?g.home:g.away));
      return {team:w, power:w===g.home?g.home_power:g.away_power};
    });
    ri++;
  }

  const champ=surv.length===1?surv[0].team:null;
  return {rounds:allRounds, champion:champ};
}

// ═══════════════════════════════════════════════════════════════════
// MONTE CARLO
// Round 1 → exact money_prob
// Round 2+ → MLE-calibrated ratings (R)
// ═══════════════════════════════════════════════════════════════════
function runSim(){
  const btn=document.getElementById('simBtn2');
  const ind=document.getElementById('runInd');
  if(btn) btn.disabled=true;
  if(ind) ind.style.display='flex';
  setTimeout(()=>{
    const games=confGames[curConf];
    const N=10000;
    const cc={};
    const allTeams=new Set(games.flatMap(g=>[g.home,g.away]));
    allTeams.forEach(t=>cc[t]=0);
    for(let s=0;s<N;s++){
      // R1: exact probs
      let surv=games.map(g=>({
        team:Math.random()<g.home_prob?g.home:g.away,
        get power(){ return this.team===g.home?g.home_power:g.away_power; }
      })).map(s=>({team:s.team,power:s.power}));
      // R2+: rated matchups
      while(surv.length>1){
        const nx=[];
        for(let i=0;i<surv.length-1;i+=2){
          const a=surv[i],b=surv[i+1];
          nx.push(Math.random()<ratedP(a.team,b.team)?a:b);
        }
        if(surv.length%2===1) nx.push(surv[surv.length-1]);
        surv=nx;
      }
      if(surv[0]) cc[surv[0].team]++;
    }
    simData=Object.entries(cc).filter(([,c])=>c>0).sort((a,b)=>b[1]-a[1])
      .map(([team,count])=>{
        const [lo,hi]=wilsonCI(count,N);
        return {team,prob:count/N,lo,hi};
      });
    if(btn) btn.disabled=false;
    if(ind) ind.style.display='none';
    redraw();
  },20);
}

// ═══════════════════════════════════════════════════════════════════
// INTERACTIONS
// ═══════════════════════════════════════════════════════════════════
function pick(ri,gi,team){
  picks[`${curConf}_r${ri}_g${gi}`]=team;
  // Clear later rounds
  Object.keys(picks).forEach(k=>{
    const m=k.match(new RegExp(`^${curConf.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}_r(\\d+)_g\\d+$`));
    if(m&&+m[1]>ri) delete picks[k];
  });
  mode='manual';
  redraw();
}

function resetBkt(){
  picks={}; mode='projected'; simData=null; redraw();
}

function drawRandom(){
  picks={}; mode='random';
  const games=confGames[curConf];
  const groups=groupByRnd(games);
  const rndNames=Object.keys(groups);
  const r0=groups[rndNames[0]]||games;

  let surv=r0.map((g,gi)=>{
    const w=Math.random()<g.home_prob?g.home:g.away;
    picks[`${curConf}_r0_g${gi}`]=w;
    return {team:w,power:w===g.home?g.home_power:g.away_power};
  });

  let ri=1;
  while(surv.length>1){
    const nx=[];
    for(let i=0;i<surv.length-1;i+=2){
      const h=surv[i],a=surv[i+1];
      const p=ratedP(h.team,a.team);
      const w=Math.random()<p?h:a;
      picks[`${curConf}_r${ri}_g${Math.floor(i/2)}`]=w.team;
      nx.push(w);
    }
    if(surv.length%2===1) nx.push(surv[surv.length-1]);
    surv=nx; ri++;
  }
  redraw();
}

// ═══════════════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════════════
function selectConf(c){
  curConf=c; picks={}; mode='projected'; simData=null;
  renderAll();
}

function redraw(){
  const games=confGames[curConf];
  const {rounds,champion}=computeBracket(games,picks);
  document.getElementById('roundsCont').innerHTML=renderRounds(rounds,champion);
  document.getElementById('statsCont').innerHTML=buildStats();
}

function renderAll(){
  const games=confGames[curConf];
  const {rounds,champion}=computeBracket(games,picks);
  const mBadge={
    projected:`<span class="mode-badge badge-projected">PROJECTED — click a team to override</span>`,
    random:`<span class="mode-badge badge-random">RANDOM DRAW — click to override</span>`,
    manual:`<span class="mode-badge badge-manual">MANUAL OVERRIDE</span>`
  }[mode];

  document.getElementById('mainArea').innerHTML=`
  <div class="sidebar">
    <div class="sidebar-label">Conferences</div>
    ${confs.map(c=>`<div class="conf-item${c===curConf?' active':''}" onclick="selectConf('${c}')">${c}<span class="gc">${confGames[c].length}G</span></div>`).join('')}
  </div>
  <div class="bracket-area">
    <div class="bracket-header">
      <div>
        <div class="bracket-title">${curConf}</div>
        <div class="bracket-meta">${games.length} GAMES · 2025–26 CONFERENCE TOURNAMENT</div>
        ${mBadge}
      </div>
      <div class="header-btn-row">
        <button class="btn btn-outline" onclick="resetBkt()">↺ RESET</button>
        <button class="btn btn-draw" onclick="drawRandom()">🎲 DRAW</button>
        <button class="btn btn-sim" onclick="runSim()">⚡ 10K SIM</button>
      </div>
    </div>
    <div class="rounds-container" id="roundsCont">${renderRounds(rounds,champion)}</div>
  </div>
  <div class="stats-panel" id="statsCont">${buildStats()}</div>`;
}

function renderRounds(rounds,champion){
  let html=rounds.map((rnd,ri)=>`
    <div class="round-col">
      <div class="round-header">${rnd.name.toUpperCase()}${rnd.isGen?' ✦':''}</div>
      <div class="round-games">${rnd.games.map((g,gi)=>renderCard(g,ri,gi)).join('')}</div>
    </div>`).join('');
  if(champion){
    const sd=simData?simData.find(r=>r.team===champion):null;
    html+=`<div class="round-col champion-col">
      <div class="round-header">🏆 CHAMPION</div>
      <div class="round-games">
        <div class="champion-card">
          <div class="champion-label">Tournament Champion</div>
          <div class="champion-name">${champion}</div>
          ${sd?`<div class="champion-sim-prob">Sim odds: ${pct(sd.prob)}</div><div class="champion-ci">95% CI: ${pct(sd.lo)} – ${pct(sd.hi)}</div>`:`<div class="champion-sim-prob" style="opacity:0.35">Run ⚡ for odds</div>`}
        </div>
      </div>
    </div>`;
  }
  return html;
}

function renderCard(g,ri,gi){
  const k=`${curConf}_r${ri}_g${gi}`;
  const winner=picks[k]||(g.home_prob>=0.5?g.home:g.away);
  const hW=winner===g.home, aW=winner===g.away;
  const hUpset=hW&&g.home_prob<0.35, aUpset=aW&&g.away_prob<0.35;
  return `<div class="game-slot"><div class="game-card">
    ${tr(g.home,g.home_prob,g.home_power,hW,aW,hUpset,ri,gi,'home')}
    ${tr(g.away,g.away_prob,g.away_power,aW,hW,aUpset,ri,gi,'away')}
  </div></div>`;
}

function tr(team,prob,power,isW,isL,isU,ri,gi,side){
  const sd=simData?simData.find(r=>r.team===team):null;
  const esc=team.replace(/'/g,"\\'");
  return `<div class="team-row${isW?' winner':isL?' loser':''}"
    onclick="pick(${ri},${gi},'${esc}')"
    onmouseenter="tip(event,'${esc}',${prob},${power}${sd?','+sd.prob:''})"
    onmouseleave="untip()">
    ${isW?'<div class="win-dot"></div>':'<div class="no-dot"></div>'}
    <span class="team-name">${team}${isU?' <span class="upset-tag">UPSET</span>':''}</span>
    <span class="team-power">${Math.round(power)}</span>
    <span class="team-prob${prob>0.65?' fav':''}">${pct(prob)}</span>
  </div>`;
}

function buildStats(){
  const games=confGames[curConf];
  const teams=[...new Map(games.flatMap(g=>[
    [g.home,{team:g.home,power:g.home_power}],
    [g.away,{team:g.away,power:g.away_power}]
  ])).values()].sort((a,b)=>b.power-a.power);
  const maxP=teams[0]?.power??1900, minP=teams[teams.length-1]?.power??1400;

  let simSec='';
  if(simData){
    const mxP=simData[0]?.prob||1;
    simSec=`<div class="stats-section">
      <h3>Championship Odds (10K Simulations)</h3>
      ${simData.slice(0,10).map((r,i)=>{
        const bw=(r.prob/mxP*100).toFixed(1);
        const loPx=(r.lo/mxP*100).toFixed(1);
        const hiPx=(r.hi/mxP*100).toFixed(1);
        return `<div class="sim-row">
          <span class="sim-rank">#${i+1}</span>
          <span class="sim-team">${r.team}</span>
          <div class="ci-bar" style="min-width:58px">
            <div class="ci-bar-track" style="left:0;right:0"></div>
            <div class="ci-bar-range" style="left:${loPx}%;width:${(+hiPx-+loPx).toFixed(1)}%"></div>
            <div class="ci-bar-point" style="left:${bw}%"></div>
          </div>
          <span class="sim-pct">${pct(r.prob)}</span>
        </div>`;
      }).join('')}
      <div style="font-family:var(--font-mono);font-size:0.52rem;color:var(--muted);margin-top:7px;line-height:1.65">
        Dot = point estimate · Bar = 95% Wilson CI<br>
        Rnd 1: model probs · Later rnds: MLE-fitted ratings
      </div>
    </div>`;
  }

  const closest=[...games].sort((a,b)=>Math.abs(a.home_prob-.5)-Math.abs(b.home_prob-.5)).slice(0,4);
  const bigFavs=[...games].sort((a,b)=>Math.max(b.home_prob,1-b.home_prob)-Math.max(a.home_prob,1-a.home_prob)).slice(0,4);

  return `${simSec}
  <div class="sim-controls">
    <div id="runInd" class="running-ind" style="display:none"><div class="spinner"></div>Simulating 10,000 tournaments…</div>
    <button id="simBtn2" class="btn btn-sim" onclick="runSim()" style="width:100%;font-size:0.88rem">⚡ RUN 10K SIM</button>
    <button class="btn btn-draw" onclick="drawRandom()" style="width:100%;font-size:0.82rem">🎲 RANDOM DRAW</button>
    <div class="sim-note">
      <strong style="color:var(--text)">3 bracket modes:</strong><br>
      <span style="color:var(--accent)">Projected</span> — model's top pick wins each game<br>
      <span style="color:var(--accent3)">Random Draw</span> — probabilistic single bracket<br>
      <span style="color:var(--accent2)">Manual</span> — click any team to override<br><br>
      Sim uses exact model probs in Rnd 1, then MLE-calibrated ratings for later matchups — internally consistent.
    </div>
  </div>
  <div class="stats-section">
    <h3>Power Ratings</h3>
    ${teams.map((t,i)=>`<div class="stat-row">
      <span class="stat-name" style="${i===0?'color:var(--accent)':''}">${t.team}</span>
      <div style="display:flex;align-items:center;gap:5px;min-width:76px">
        <div class="prob-bar" style="flex:1"><div class="prob-fill" style="width:${((t.power-minP)/(maxP-minP)*100).toFixed(1)}%"></div></div>
        <span class="stat-val">${Math.round(t.power)}</span>
      </div>
    </div>`).join('')}
  </div>
  <div class="stats-section">
    <h3>Closest Games</h3>
    ${closest.map(g=>`<div class="stat-row">
      <span class="stat-name" style="font-size:0.68rem">${g.home} vs ${g.away}</span>
      <span class="stat-val">${pct(Math.max(g.home_prob,1-g.home_prob))}</span>
    </div>`).join('')}
  </div>
  <div class="stats-section">
    <h3>Biggest Favorites</h3>
    ${bigFavs.map(g=>{const f=g.home_prob>.5?g.home:g.away;const p=Math.max(g.home_prob,1-g.home_prob);return`<div class="stat-row"><span class="stat-name">${f}</span><span class="stat-val">${pct(p)}</span></div>`;}).join('')}
  </div>`;
}

// ═══════════════════════════════════════════════════════════════════
// TOOLTIP
// ═══════════════════════════════════════════════════════════════════
function tip(e,team,prob,power,simProb){
  const t=document.getElementById('tt');
  const r=R[team];
  let h=`<strong>${team}</strong><br>Win prob: ${pct(prob)}<br>Power rating: ${Math.round(power)}`;
  if(r!==undefined) h+=`<br>MLE rating: ${r>0?'+':''}${r.toFixed(3)}`;
  if(simProb!=null) h+=`<br>Sim champ: ${pct(simProb)}`;
  t.innerHTML=h; t.style.display='block';
  t.style.left=(e.clientX+14)+'px'; t.style.top=(e.clientY-8)+'px';
}
function untip(){ document.getElementById('tt').style.display='none'; }

// ═══════════════════════════════════════════════════════════════════
// HOME SCREEN
// ═══════════════════════════════════════════════════════════════════
function showHome(){
  curConf=null; simData=null; picks={};
  document.getElementById('mainArea').innerHTML=`
  <div class="home-screen">
    <div class="home-title">SELECT A<br>CONFERENCE</div>
    <div class="home-sub">
      130 games · 29 conferences · 2025–26 season<br><br>
      <span style="color:var(--accent)">Projected</span> bracket shows the model's top pick at each game.<br>
      <span style="color:var(--accent3)">🎲 Random Draw</span> generates one probabilistic simulation.<br>
      <span style="color:var(--accent2)">Click any team</span> to manually override the bracket.<br>
      <span style="color:var(--text)">⚡ 10K Sim</span> runs Monte Carlo and shows championship<br>
      odds with 95% confidence intervals.<br><br>
      Round 1 uses HefML model probabilities. Later rounds use<br>
      MLE-calibrated team ratings derived from those same probabilities<br>
      for internally consistent simulation throughout.
    </div>
    <div class="conf-grid">
      ${confs.map(c=>`<div class="conf-pill" onclick="selectConf('${c}')"><span>${c}</span><span class="gc">${confGames[c].length}G</span></div>`).join('')}
    </div>
  </div>`;
}

showHome();
</script>
