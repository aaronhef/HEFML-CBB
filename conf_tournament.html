<title>Conference Tournament Simulator 2026</title>

*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0a;color:#e8e8e8;font-family:'Arial Narrow',Arial,sans-serif;min-height:100vh}
#hdr{background:#0c0c0c;border-bottom:2px solid #e8f430;padding:10px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
#hdr h1{font-family:'Arial Black','Arial Bold',Impact,sans-serif;font-size:22px;letter-spacing:3px;color:#e8f430;text-transform:uppercase}
.hsub{font-family:'Courier New',Courier,monospace;font-size:9px;color:#555;letter-spacing:1px}
#hconf{font-family:'Arial Black','Arial Bold',Impact,sans-serif;font-size:16px;color:#aaa;display:none}
#back{display:none;margin-left:auto;background:none;border:1px solid #252525;color:#555;padding:4px 12px;cursor:pointer;font-family:'Courier New',Courier,monospace;font-size:10px}
#back:hover{border-color:#e8f430;color:#e8f430}
#home{padding:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:9px}
.cc{background:#111;border:1px solid #252525;padding:13px 15px;cursor:pointer;transition:.12s;position:relative;overflow:hidden}
.cc::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:#e8f430;transform:scaleX(0);transform-origin:left;transition:.18s}
.cc:hover{border-color:#2a2a2a;background:#181818}
.cc:hover::after{transform:scaleX(1)}
.cc .cn{font-family:'Arial Black','Arial Bold',Impact,sans-serif;font-size:18px;letter-spacing:1px;color:#ccc}
.cc .cm{font-family:'Courier New',Courier,monospace;font-size:9px;color:#555;margin-top:2px}
.cc .ct{font-family:'Courier New',Courier,monospace;font-size:10px;color:#e8f430;margin-top:6px}
.cc .cr{font-family:'Courier New',Courier,monospace;font-size:8px;color:#555}
#bv{display:none;padding:18px}
.bctl{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.mb{background:none;border:1px solid #252525;color:#555;padding:5px 13px;cursor:pointer;font-family:'Courier New',Courier,monospace;font-size:10px;transition:.1s}
.mb.on{background:#e8f430;color:#000;border-color:#e8f430;font-weight:700}
.mb:hover:not(.on){border-color:#e8f430;color:#e8f430}
.sb{margin-left:auto;background:#e8f430;color:#000;border:none;padding:5px 16px;cursor:pointer;font-family:'Courier New',Courier,monospace;font-size:10px;font-weight:700}
.sb:hover{background:#fff}
.sb:disabled{opacity:.5;cursor:default}
#mlbl{font-family:'Courier New',Courier,monospace;font-size:9px;padding:3px 7px;border:1px solid}
.lp{color:#94a3b8;border-color:#94a3b8}.lr{color:#ff6b35;border-color:#ff6b35}.lm{color:#a78bfa;border-color:#a78bfa}
#si{font-family:'Courier New',Courier,monospace;font-size:9px;color:#555}
.bwrap{overflow-x:auto;padding-bottom:10px}
.brow{display:flex;gap:0;min-width:max-content}
.brnd{display:flex;flex-direction:column;min-width:192px;max-width:192px;border-right:1px solid #252525;padding:0 8px 6px}
.brnd:last-child{border-right:none}
.rh{font-family:'Courier New',Courier,monospace;font-size:9px;color:#555;letter-spacing:1px;text-transform:uppercase;padding-bottom:5px;border-bottom:1px solid #252525;margin-bottom:8px}
.rgs{display:flex;flex-direction:column;gap:8px;flex:1;justify-content:space-around}
.mu{border-left:2px solid #252525;padding-left:6px;display:flex;flex-direction:column;gap:2px}
.mu.dec{border-left-color:#e8f430}
.ts{display:flex;align-items:center;gap:3px;padding:4px 7px;background:#111;border:1px solid #252525;min-height:29px;font-size:11px;font-weight:600;transition:.1s}
.ts.click{cursor:pointer}
.ts.click:hover{background:#181818}
.ts.won{background:#0e1e06;border-color:#4ade80;color:#4ade80}
.ts.lost{opacity:.3}
.ts.uwin{border-color:#ff6b35!important;background:#160800}
.ts.tbd{color:#555;font-style:italic;font-size:10px;font-weight:400}
.ts .tn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ts .pw{font-family:'Courier New',Courier,monospace;font-size:8px;color:#555;flex-shrink:0}
.ts .pb{font-family:'Courier New',Courier,monospace;font-size:8px;color:#555;flex-shrink:0;min-width:24px;text-align:right}
.udot{width:5px;height:5px;background:#ff6b35;border-radius:50%;flex-shrink:0}
.cbox{border:2px solid #e8f430;padding:12px 18px;text-align:center;background:#0a1200;margin-top:10px;display:none}
.cl{font-family:'Courier New',Courier,monospace;font-size:9px;color:#555;letter-spacing:2px}
.cn2{font-family:'Arial Black','Arial Bold',Impact,sans-serif;font-size:28px;color:#e8f430;letter-spacing:2px}
.cs{font-family:'Courier New',Courier,monospace;font-size:10px;color:#4ade80}
.strow{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px;border-top:1px solid #252525;padding-top:14px}
@media(max-width:600px){.strow{grid-template-columns:1fr}}
.stb h3{font-family:'Arial Black','Arial Bold',Impact,sans-serif;font-size:14px;color:#555;letter-spacing:1px;margin-bottom:7px}
.sr{display:flex;align-items:center;gap:5px;margin-bottom:5px}
.sn{font-family:'Courier New',Courier,monospace;font-size:9px;flex:0 0 130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbar{flex:1;height:5px;background:#181818}.sfill{height:100%;background:#e8f430}
.sp{font-family:'Courier New',Courier,monospace;font-size:9px;color:#e8f430;flex:0 0 32px;text-align:right}
.sci{font-family:'Courier New',Courier,monospace;font-size:8px;color:#555;flex:0 0 66px;text-align:right}
.ctbl{width:100%;border-collapse:collapse}
.ctbl td{font-family:'Courier New',Courier,monospace;font-size:9px;padding:3px 5px;border-bottom:1px solid #252525}
.ctbl td:last-child{color:#e8f430}
</style>
</head>

const sig = x => 1/(1+Math.exp(-x));
const mle = (h,a) => sig((R[h]||0)-(R[a]||0));
const GL = {};
GAMES.forEach(g=>{
GL[g.home+’|’+g.away]=g;
GL[g.away+’|’+g.home]={…g,prob:1-g.prob,home:g.away,away:g.home};
});
function gp(h,a){ return (GL[h+’|’+a]||{}).prob ?? mle(h,a); }
const CG={};
GAMES.forEach(g=>(CG[g.conf]||(CG[g.conf]=[])).push(g));

function pick(h,a,p,mode,ov){
if(ov) return ov;
if(!h||h===’?’) return a; if(!a||a===’?’) return h;
return mode===‘projected’?(p>=.5?h:a):(Math.random()<p?h:a);
}

function simBD(conf,mode,OV){
const def=BD[conf], allW={};
const log={};
def.slots.forEach((slots,ri)=>{
const rname=def.rounds[ri];
const prevW=ri>0?(allW[ri-1]||[]):[];
const r1W=allW[0]||[];
const rLog=[],rW=[];
slots.forEach((s,si)=>{
let h,a,p,key;
if(s.t===‘g’){
const g=GL[s.h+’|’+s.a]||GL[s.a+’|’+s.h];
h=g?g.home:s.h; a=g?g.away:s.a; p=g?g.prob:mle(s.h,s.a); key=‘g_’+(g?g.id:h+a);
} else if(s.t===‘br1’){
h=s.bye; a=r1W[s.s]||’?’; p=gp(h,a); key=‘br1_’+rname+’*’+si;
} else if(s.t===‘bpv’){
h=s.bye; a=prevW[s.s]||’?’; p=gp(h,a); key=’bpv*’+rname+’*’+si;
} else if(s.t===‘pt’){
rW.push(r1W[s.s]||’?’); return;
} else if(s.t===‘pv’){
h=prevW[s.a]||’?’; a=prevW[s.b]||’?’;
p=(h!==’?’&&a!==’?’)?gp(h,a):.5; key=’pv*’+rname+’_’+si;
}
const w=pick(h,a,p,mode,OV&&OV[key]);
rLog.push({h,a,p,w,key}); rW.push(w);
});
log[rname]=rLog; allW[ri]=rW;
});
const lastRi=def.slots.length-1;
return{log,champion:allW[lastRi]&&allW[lastRi][0]};
}

function simGen(conf,mode,OV){
const gs=CG[conf]||[];
const RO=[‘1st Round’,‘2nd Round’,‘3rd Round’,‘Quarterfinal’,‘Semifinal’,‘Final’];
const byR={};
gs.forEach(g=>(byR[g.round]||(byR[g.round]=[])).push(g));
const dRnds=[…new Set(gs.map(g=>g.round))].sort((a,b)=>RO.indexOf(a)-RO.indexOf(b));
const lastDRi=RO.indexOf(dRnds[dRnds.length-1]);
const allRnds=[…dRnds,…RO.slice(lastDRi+1)];
const log={}; let pool=[];
dRnds.forEach(r=>{
const rLog=[],winners=[];
(byR[r]||[]).forEach(g=>{
const key=‘g_’+g.id, ov=OV&&OV[key];
const w=pick(g.home,g.away,g.prob,mode,ov);
rLog.push({h:g.home,a:g.away,p:g.prob,w,key}); winners.push(w);
});
log[r]=rLog; pool=winners;
});
allRnds.filter(r=>!byR[r]).forEach(r=>{
const rLog=[],winners=[];
for(let i=0;i<pool.length;i+=2){
const h=pool[i],a=pool[i+1]; if(!h||!a) continue;
const p=gp(h,a), key=r+’_’+i, ov=OV&&OV[key];
const w=pick(h,a,p,mode,ov);
rLog.push({h,a,p,w,key}); winners.push(w);
}
log[r]=rLog; pool=winners;
});
return{log,champion:pool[0]||null};
}

function simConf(conf,mode,OV){ return BD[conf]?simBD(conf,mode,OV):simGen(conf,mode,OV); }

function tslot(team,prob,won,lost,upset,key){

if(mode===‘manual’) cls.push(‘click’);

const oc=mode===‘manual’?‘onclick=“clickSlot('’ + key + ‘','’ + team.replace(/’/g,”\’”) + ‘')”’:’’;
return ‘<div class=”’+cls.join(’ ‘)+’” ‘+oc+’ title=”’+team+’ | MLE:’+rs+’ | ‘+pct+’%”>’
+(upset&&won?’<div class="udot"></div>’:’’)
+’<span class="tn">’+team+’</span><span class="pw">’+rs+’</span><span class="pb">’+pct+’%</span>’

}

simRes=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).map(([t,c])=>{
const p=c/N,z=1.96,d=1+z*z/N;
const lo=Math.max(0,(p+z*z/(2*N)-z*Math.sqrt(p*(1-p)/N+z*z/(4*N*N)))/d);

});
